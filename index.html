<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#0066cc" />
    <meta name="description" content="3D/AR Product Showcase" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
    <link rel="stylesheet" href="css/styles.css" />
    <title>Product Showcase</title>
  </head>
  <body>
    <div id="app">
      <main class="viewer-container">
        <model-viewer
          id="viewer"
          camera-controls
          auto-rotate
          auto-rotate-delay="0"
          interaction-policy="always"
          shadow-intensity="0.6"
          shadow-softness="1"
          environment-image="neutral"
          reveal="auto"
          ar
          ar-placement="floor"
          ar-scale="auto"
        ></model-viewer>

        <div
          id="loading-overlay"
          class="loading-overlay"
          role="status"
          aria-live="polite"
        >
          <div class="loading-overlay__spinner"></div>
          <p class="loading-overlay__text">Loading 3D model…</p>
          <div class="loading-overlay__progress">
            <div
              id="loading-progress"
              class="loading-overlay__progress-bar"
            ></div>
          </div>
        </div>

        <div id="error-overlay" class="error-overlay" role="alert">
          <div class="error-overlay__icon" aria-hidden="true">⚠️</div>
          <h2 class="error-overlay__title">Failed to load model</h2>
          <p class="error-overlay__message">
            The 3D model could not be loaded. Please check your connection and
            try again.
          </p>
          <button id="retry-btn" class="btn btn--primary">Try Again</button>
        </div>

        <button
          id="reset-view-btn"
          class="reset-view-btn btn btn--secondary"
          aria-label="Reset view"
          title="Reset view"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"></path>
            <path d="M21 12a9 9 0 11-9 9 9.75 9.75 0 016.74-2.74L21 16"></path>
          </svg>
        </button>

        <div
          id="hotspots-container"
          class="hotspots"
          role="group"
          aria-label="Product features"
        ></div>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="js/main.js"></script>
    <script type="module" src="vendor/model-viewer.min.js"></script>
  </body>
</html>
